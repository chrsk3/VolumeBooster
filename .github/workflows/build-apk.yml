name: Build VolumeBooster APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VolumeBooster.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolumeBooster-APK
          path: VolumeBooster.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.3 VolumeBooster.apk \
            --title "VolumeBooster v1.0.3" \
            --notes "Vinculação direta de audioSessionId no DemoPlayer e AudioPlaybackCallback automático no AudioService." \
            || gh release upload v1.0.3 VolumeBooster.apk --clobber
